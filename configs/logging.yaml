# configs/logging.yaml
# Reference logging configuration (actual setup is applied programmatically
# in core/logger.py using these values as documented defaults).

version: 1
log_level: INFO
log_dir: "logs"
app_log_file: "app.log"
audit_log_file: "audit.log"
max_bytes: 5000000
backup_count: 3
format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
redact_patterns:
  - "api_key"
  - "token"
  - "password"
  - "secret"
  - "webhook_url"
